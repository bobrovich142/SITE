<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 — HTML5 игра</title>
  <style>
    body {
      margin: 0;
      background-color: #faf8ef;
      color: #776e65;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
      touch-action: none;
    }
    .header {
      width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .title {
      font-size: 46px;
      font-weight: bold;
      margin: 0;
    }
    .scores {
      display: flex;
      gap: 8px;
    }
    .score-box {
      background: #bbada0;
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 6px;
      text-align: center;
      min-width: 60px;
    }
    .score-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #eee4da;
    }
    .score-val {
      font-size: 20px;
      font-weight: bold;
    }
    .toolbar {
      width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    button {
      background: #8f7a66;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #9f8b77;
    }
    .board-wrap {
      position: relative;
      background: #bbada0;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 75px);
      grid-template-rows: repeat(4, 75px);
      gap: 12px;
    }
    .cell {
      width: 75px;
      height: 75px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 32px;
      transition: transform 0.1s ease;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(238, 228, 218, 0.85);
      border-radius: 10px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .overlay.active {
      display: flex;
    }
    .overlay-text {
      font-size: 36px;
      font-weight: bold;
      color: #776e65;
    }
    .hint {
      margin-top: 14px;
      font-size: 14px;
      color: #8f7a66;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 class="title">2048</h1>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">Счёт</div>
        <div class="score-val" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Рекорд</div>
        <div class="score-val" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <span>Объединяйте плитки до <b>2048</b>!</span>
    <button onclick="initGame()">Новая игра</button>
  </div>

  <div class="board-wrap" id="boardWrap">
    <div class="grid" id="grid"></div>
    <div class="overlay" id="overlay">
      <div class="overlay-text" id="overlayText">Игра окончена!</div>
      <button onclick="initGame()">Попробовать снова</button>
    </div>
  </div>

  <div class="hint">Управление: <b>Стрелки</b>, <b>WASD</b> или <b>свайп</b> по полю</div>

  <script>
    const gridEl = document.getElementById('grid');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlayEl = document.getElementById('overlay');
    const overlayTextEl = document.getElementById('overlayText');

    let board = new Array(16).fill(0);
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('best2048')) || 0;
    let won = false;

    bestEl.textContent = bestScore;

    function getTileStyle(val) {
      const styles = new Map();
      styles.set(0, { bg: '#cdc1b4', color: 'transparent', size: '32px' });
      styles.set(2, { bg: '#eee4da', color: '#776e65', size: '34px' });
      styles.set(4, { bg: '#ede0c8', color: '#776e65', size: '34px' });
      styles.set(8, { bg: '#f2b179', color: '#f9f6f2', size: '34px' });
      styles.set(16, { bg: '#f59563', color: '#f9f6f2', size: '32px' });
      styles.set(32, { bg: '#f67c5f', color: '#f9f6f2', size: '32px' });
      styles.set(64, { bg: '#f65e3b', color: '#f9f6f2', size: '32px' });
      styles.set(128, { bg: '#edcf72', color: '#f9f6f2', size: '28px' });
      styles.set(256, { bg: '#edcc61', color: '#f9f6f2', size: '28px' });
      styles.set(512, { bg: '#edc850', color: '#f9f6f2', size: '28px' });
      styles.set(1024, { bg: '#edc53f', color: '#f9f6f2', size: '22px' });
      styles.set(2048, { bg: '#edc22e', color: '#f9f6f2', size: '22px' });
      return styles.get(val) || { bg: '#3c3a32', color: '#f9f6f2', size: '20px' };
    }

    function initGame() {
      board = new Array(16).fill(0);
      score = 0;
      won = false;
      overlayEl.classList.remove('active');
      addRandomTile();
      addRandomTile();
      render();
    }

    function addRandomTile() {
      const empty = new Array();
      for (let i = 0; i < 16; i++) {
        if (board.at(i) === 0) empty.push(i);
      }
      if (empty.length === 0) return;
      const randPos = empty.at(Math.floor(Math.random() * empty.length));
      board.splice(randPos, 1, Math.random() < 0.9 ? 2 : 4);
    }

    function slideLine(line) {
      let filtered = line.filter(v => v !== 0);
      let merged = new Array();
      let points = 0;

      for (let i = 0; i < filtered.length; i++) {
        if (i + 1 < filtered.length && filtered.at(i) === filtered.at(i + 1)) {
          const newVal = filtered.at(i) * 2;
          merged.push(newVal);
          points += newVal;
          if (newVal === 2048 && !won) {
            won = true;
            setTimeout(() => alert('Поздравляем! Вы собрали 2048! Можно играть дальше.'), 100);
          }
          i++;
        } else {
          merged.push(filtered.at(i));
        }
      }

      while (merged.length < 4) {
        merged.push(0);
      }
      return { line: merged, points: points };
    }

    function move(dir) {
      let moved = false;
      let gained = 0;

      for (let i = 0; i < 4; i++) {
        let line = new Array();
        for (let j = 0; j < 4; j++) {
          let idx = 0;
          if (dir === 'left') idx = i * 4 + j;
          if (dir === 'right') idx = i * 4 + (3 - j);
          if (dir === 'up') idx = j * 4 + i;
          if (dir === 'down') idx = (3 - j) * 4 + i;
          line.push(board.at(idx));
        }

        const res = slideLine(line);
        gained += res.points;

        for (let j = 0; j < 4; j++) {
          let idx = 0;
          if (dir === 'left') idx = i * 4 + j;
          if (dir === 'right') idx = i * 4 + (3 - j);
          if (dir === 'up') idx = j * 4 + i;
          if (dir === 'down') idx = (3 - j) * 4 + i;

          if (board.at(idx) !== res.line.at(j)) {
            moved = true;
            board.splice(idx, 1, res.line.at(j));
          }
        }
      }

      if (moved) {
        score += gained;
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem('best2048', bestScore);
        }
        addRandomTile();
        render();
        if (isGameOver()) {
          overlayTextEl.textContent = 'Ходов больше нет!';
          overlayEl.classList.add('active');
        }
      }
    }

    function isGameOver() {
      for (let i = 0; i < 16; i++) {
        if (board.at(i) === 0) return false;
        const row = Math.floor(i / 4);
        const col = i % 4;
        if (col < 3 && board.at(i) === board.at(i + 1)) return false;
        if (row < 3 && board.at(i) === board.at(i + 4)) return false;
      }
      return true;
    }

    function render() {
      gridEl.innerHTML = '';
      scoreEl.textContent = score;
      bestEl.textContent = bestScore;

      for (let i = 0; i < 16; i++) {
        const val = board.at(i);
        const style = getTileStyle(val);
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.style.backgroundColor = style.bg;
        cell.style.color = style.color;
        cell.style.fontSize = style.size;
        cell.textContent = val === 0 ? '' : val;
        gridEl.appendChild(cell);
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') {
        move('left');
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') {
        move('right');
      } else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === 'ц' || e.key === 'Ц') {
        move('up');
      } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S' || e.key === 'ы' || e.key === 'Ы') {
        move('down');
      }
    });

    // Поддержка свайпов на телефоне и мышью
    let startX = 0;
    let startY = 0;
    const boardWrap = document.getElementById('boardWrap');

    boardWrap.addEventListener('pointerdown', (e) => {
      startX = e.clientX;
      startY = e.clientY;
    });

    boardWrap.addEventListener('pointerup', (e) => {
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;

      if (Math.abs(dx) > Math.abs(dy)) {
        move(dx > 0 ? 'right' : 'left');
      } else {
        move(dy > 0 ? 'down' : 'up');
      }
    });

    initGame();
  </script>
</body>
</html>
